; ============================================================================
;  Gbairai — Buzzer ESP32 (PlatformIO)
; ----------------------------------------------------------------------------
;  Ouvre le dossier `tools/firmware-esp32/` dans VSCode (PlatformIO le détecte).
;  PlatformIO télécharge TOUT SEUL les bibliothèques listées dans lib_deps.
;
;    Compiler        : PlatformIO: Build     (icône ✓ / Ctrl+Alt+B)
;    Téléverser      : PlatformIO: Upload    (icône →)
;    Moniteur série  : PlatformIO: Monitor   (icône 🔌, 115200 bauds)
;
;  Carte : ESP32-WROOM-32 DevKit  →  board = esp32dev
; ============================================================================

[platformio]
; Le code source (.ino) est dans le sous-dossier gbairai_buzzer/.
src_dir = gbairai_buzzer

[env:esp32dev]
; Version FIGÉE : le core ESP32 3.x change l'API LEDC (anneau du bouton) et
; d'autres appels. Le firmware est validé sur le core 2.0.17 (platform 6.x).
; Ne dégeler qu'après avoir revérifié le firmware sur la nouvelle API.
platform  = espressif32@~6.9.0
board     = esp32dev
framework  = arduino

monitor_speed = 115200
upload_speed  = 921600        ; si l'upload échoue, redescends à 115200

; Bibliothèques (installées automatiquement au 1er build)
lib_deps =
	tzapu/WiFiManager @ ^2.0.17
	links2004/WebSockets @ ^2.4.1
	adafruit/Adafruit NeoPixel @ ^1.12.0
