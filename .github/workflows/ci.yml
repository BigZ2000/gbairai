# ──────────────────────────────────────────────────────────────────────────────
# CI — Intégration Continue.
# But : à chaque push / PR, prouver que le frontend build, que le backend est
# syntaxiquement sain (Prisma + node --check) et que les images Docker se
# construisent. AUCUN déploiement ici (voir deploy.yml).
# Réf : https://docs.github.com/actions
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  client:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      # Tests des composants (jsdom) : équipes, lancement, retour de paiement…
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client

  server:
    name: Check backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx prisma generate
        working-directory: server
      - run: node --check src/server.js
        working-directory: server
      # Tests unitaires (contrôle des quiz, plans, correspondance des réponses) :
      # sans base ni réseau.
      - run: npm test
        working-directory: server

  integration:
    name: Tests d'intégration backend
    runs-on: ubuntu-latest
    # Base PostgreSQL jetable ; IA et CinetPay sont simulés (aucun appel réseau).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gbairai
          POSTGRES_PASSWORD: gbairai
          POSTGRES_DB: gbairai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gbairai" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gbairai:gbairai@localhost:5432/gbairai
      JWT_SECRET: ci-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npm run test:integration
        working-directory: server

  docker:
    name: Build images Docker
    runs-on: ubuntu-latest
    needs: [client, server, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build image edge
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
